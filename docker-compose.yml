services:
  api:
    build:
      context: .
      target: dev
    command: npm run start:dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  worker:
    build:
      context: .
      target: dev
    command: npm run start:worker:dev
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUCTION_MIN_DURATION_SECONDS: ${AUCTION_MIN_DURATION_SECONDS:-30}
      NEXT_PUBLIC_AUCTION_MAX_DURATION_SECONDS: ${AUCTION_MAX_DURATION_SECONDS:-604800}
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: auction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
